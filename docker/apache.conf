<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logs
    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Security headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-XSS-Protection "1; mode=block"

    # ── Compressão gzip (mod_deflate) ────────────────────────────────────────
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css
        AddOutputFilterByType DEFLATE application/javascript application/json
        AddOutputFilterByType DEFLATE image/svg+xml application/xml text/xml
        AddOutputFilterByType DEFLATE font/woff2 font/woff font/ttf

        # Não comprimir respostas já comprimidas
        SetEnvIfNoCase Request_URI "\.(?:gz|br|zip|bz2)$" no-gzip dont-vary

        # Adiciona Vary para caches intermediários
        Header append Vary Accept-Encoding
    </IfModule>

    # ── Compressão brotli (mod_brotli) — só ativo se disponível ──────────────
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/css
        AddOutputFilterByType BROTLI_COMPRESS application/javascript application/json
        AddOutputFilterByType BROTLI_COMPRESS image/svg+xml application/xml text/xml
        AddOutputFilterByType BROTLI_COMPRESS font/woff2 font/woff font/ttf
        BrotliCompressionQuality 5
        Header append Vary Accept-Encoding
    </IfModule>

    # ── Cache de assets estáticos ─────────────────────────────────────────────
    <FilesMatch "\.(css|js|woff2?|ttf|svg|ico|png|jpg|webp)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
</VirtualHost>
